[versions]
kotlin = "2.4.21"
agp = "9.4.1"
junit = "6.1.3"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
androidxTestExt = "1.3.0"
androidxTestRunner = "1.7.0"

[libraries]
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
junit4 = { group = "junit", name = "junit", version = "4.13.2" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExt" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
# 故意没有 kotlin-android：AGP 9.0 起 Kotlin 支持内置在 AGP 里，
# 再声明这个插件会被 KGP 直接拒绝加载（"plugin is no longer required for Kotlin support since AGP 9.0"），
# 而且 version.ref = "kotlin" 还会撞上 Gradle 的
# "plugin is already on the classpath with an unknown version"（本地 :app:tasks 实测）。
# :app 的 Kotlin 配置因此只写 android { ... } 同级的 kotlin { compilerOptions { ... } }。
