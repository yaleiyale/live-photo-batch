name: CI
on:
  workflow_dispatch:
  push:
    branches: [ "main", "feat/*" ]
  pull_request:
    branches: [ "main" ]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core-tests:
    name: Core unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: ./gradlew :core:test --no-daemon
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: ./.github/actions/android-sdk
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: vlive-debug
          path: app/build/outputs/apk/debug/*.apk
      # release 走的是 signingConfigs.getByName("debug")（app/build.gradle.kts 的 buildTypes.release），
      # 所以这个包能侧载、能与 debug 包互相覆盖安装，但不能上商店。
      - uses: actions/upload-artifact@v4
        with:
          name: vlive-release
          path: app/build/outputs/apk/release/*.apk
