name: CI
on:
  workflow_dispatch:
  push:
    branches: [ "main", "feat/*" ]
  pull_request:
    branches: [ "main" ]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core-tests:
    name: Core unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: ./gradlew :core:test --no-daemon
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      # 不用 android-actions/setup-android@v3：它默认 packages 是 `tools platform-tools`，
      # 而 `tools` 早已被 Google 从 SDK 仓库里删掉，sdkmanager 会直接
      # "Warning: Failed to find package 'tools'" + exit 1，在 Gradle 启动之前就把 job 挂掉。
      # ubuntu-latest 自带 SDK 与 cmdline-tools，licenses 也已预接受，所以这里只补缺的两个包。
      - name: Install SDK platform 37
        run: |
          SDKM="$(command -v sdkmanager || echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKM" --licenses > /dev/null
          "$SDKM" "build-tools;36.0.0"
          # compileSdk = 37 / compileSdkMinor = 0 解析到的就是这一个包，它是本 job 的
          # 硬依赖：装不上必须让这一步红，不能跟着下面的循环一起被容忍——
          # 包被改名/不可用时，后果只是 Gradle 在后面报一堆难读的 "no matching platform" 错误。
          "$SDKM" "platforms;android-37.0"
          # 备用名继续容忍：SDK 仓库里 37 只有 android-37.0 / android-37.1（repository2-3.xml），
          # 没有裸 android-37，这一轮循环只为"万一 AGP 要的是别的 hash"兜底。
          for p in "platforms;android-37" "platforms;android-37.1"; do
            "$SDKM" "$p" || echo "not in repository: $p"
          done
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: vlive-debug
          path: app/build/outputs/apk/debug/*.apk
      # release 走的是 signingConfigs.getByName("debug")（app/build.gradle.kts 的 buildTypes.release），
      # 所以这个包能侧载、能与 debug 包互相覆盖安装，但不能上商店。
      - uses: actions/upload-artifact@v4
        with:
          name: vlive-release
          path: app/build/outputs/apk/release/*.apk
