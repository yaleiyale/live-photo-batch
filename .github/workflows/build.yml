name: CI
on:
  workflow_dispatch:
  push:
    branches: [ "main", "feat/*" ]
  pull_request:
    branches: [ "main" ]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core-tests:
    name: Core unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: ./gradlew :core:test --no-daemon
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      # 不用 android-actions/setup-android@v3：它默认 packages 是 `tools platform-tools`，
      # 而 `tools` 早已被 Google 从 SDK 仓库里删掉，sdkmanager 直接
      # "Warning: Failed to find package 'tools'" + exit 1（run 39084047755 的 apk job 因此
      # 在 Gradle 启动之前就挂了）。ubuntu-latest 自带 SDK 与 cmdline-tools，
      # licenses 也已预接受，所以这里只补 Task 9 需要的两个包。
      - name: Install SDK platform 36
        run: |
          SDKM="$(command -v sdkmanager || echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKM" --licenses > /dev/null
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: live-photo-batch-debug
          path: app/build/outputs/apk/debug/*.apk
