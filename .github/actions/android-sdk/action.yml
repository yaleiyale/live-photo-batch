name: Install the Android SDK packages this build needs
description: >
  ubuntu-latest 自带 SDK 与 cmdline-tools，licenses 也已预接受，所以这里只补缺的包。
  不用 android-actions/setup-android@v3：它默认 packages 是 `tools platform-tools`，而 `tools`
  早已被 Google 从 SDK 仓库里删掉，sdkmanager 会直接 "Warning: Failed to find package 'tools'"
  + exit 1，在 Gradle 启动之前就把 job 挂掉。

runs:
  using: composite
  steps:
    - name: Install build-tools and platform 37
      shell: bash
      run: |
        SDKM="$(command -v sdkmanager || echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager")"
        # 喂 y 用进程替换，不用 `yes | sdkmanager`：composite 的步骤跑在 `bash -eo pipefail`
        # 下（inline 的 run 步不写 shell 键时才是 `bash -e`），读取者一关管道，`yes` 就死于
        # SIGPIPE，管道状态变成 141——一条已经成功的命令会把整个步骤判红。
        "$SDKM" --licenses > /dev/null < <(yes)
        "$SDKM" "build-tools;36.0.0"
        # compileSdk = 37 / compileSdkMinor = 0 解析到的就是这一个包，它是硬依赖：
        # 装不上必须让这一步红，不能跟着下面的循环一起被容忍——包被改名/不可用时，
        # 后果只是 Gradle 在后面报一堆难读的 "no matching platform" 错误。
        "$SDKM" "platforms;android-37.0"
        # 备用名继续容忍：SDK 仓库里 37 只有 android-37.0 / android-37.1（repository2-3.xml），
        # 没有裸 android-37，这一轮循环只为"万一 AGP 要的是别的 hash"兜底。
        for p in "platforms;android-37" "platforms;android-37.1"; do
          "$SDKM" "$p" || echo "not in repository: $p"
        done
